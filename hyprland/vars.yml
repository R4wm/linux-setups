---
# Hyprland Configuration Variables

# User configuration
target_user: "{{ ansible_user }}"
user_home: "/home/{{ target_user }}"

# Config directories
config_base: "{{ user_home }}/.config"
hyprland_dir: "{{ config_base }}/hypr"
waybar_dir: "{{ config_base }}/waybar"
mako_dir: "{{ config_base }}/mako"

# Package lists (only actively used packages)
hyprland_packages:
  # Core Hyprland
  - hyprland
  - xdg-desktop-portal-hyprland

  # UI Components
  - waybar           # Status bar
  - mako             # Notifications
  - wofi             # App launcher
  - rofi             # Used for clipboard history menu

  # System utilities
  - alacritty        # Terminal ($terminal)
  - dolphin          # File manager ($fileManager)
  - cliphist         # Clipboard history manager
  - wl-clipboard     # Wayland clipboard (wl-paste, wl-copy)
  - brightnessctl    # Brightness control
  - playerctl        # Media player control
  - wireplumber      # Audio control (provides wpctl)

  # Fonts
  - otf-font-awesome
  - ttf-fira-code
  - ttf-nerd-fonts-symbols-mono
