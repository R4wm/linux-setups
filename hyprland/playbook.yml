---
- name: Setup Lean Arch Linux + Hyprland Desktop
  hosts: arch_desktops:arch_laptops

  tasks:
    - name: Build effective package list
      set_fact:
        hyprland_packages: "{{ hyprland_packages_common + hyprland_packages_extra }}"

    - name: Verify target is Arch Linux
      assert:
        that:
          - ansible_facts['distribution'] == "Archlinux"
        fail_msg: "This playbook is designed for Arch Linux only"
        success_msg: "Target is Arch Linux, proceeding"

    - name: Update pacman cache
      community.general.pacman:
        update_cache: yes
      become: yes

    # --- User setup ---

    - name: Create additional user r4wm
      user:
        name: "{{ additional_user }}"
        shell: /bin/bash
        groups: wheel,docker
        append: yes
        create_home: yes
      become: yes

    - name: Ensure wheel group has sudo access
      lineinfile:
        path: /etc/sudoers
        regexp: '^# ?%wheel ALL=\(ALL:ALL\) ALL'
        line: '%wheel ALL=(ALL:ALL) ALL'
        validate: 'visudo -cf %s'
      become: yes

    # --- Core packages ---

    - name: Install Hyprland and related packages
      community.general.pacman:
        name: "{{ hyprland_packages }}"
        state: present
      become: yes

    - name: Enable multilib repository
      replace:
        path: /etc/pacman.conf
        regexp: '(?ms)^#\[multilib\]\n#Include = /etc/pacman\.d/mirrorlist'
        replace: "[multilib]\nInclude = /etc/pacman.d/mirrorlist"
      become: yes

    - name: Refresh pacman cache after enabling multilib
      community.general.pacman:
        update_cache: yes
      become: yes

    # --- GPU (AMD) ---

    - name: Install AMD GPU packages
      community.general.pacman:
        name: "{{ gpu_packages }}"
        state: present
      become: yes

    # --- Development tools ---

    - name: Install development packages
      community.general.pacman:
        name: "{{ dev_packages }}"
        state: present
      become: yes

    - name: Install container packages
      community.general.pacman:
        name: "{{ container_packages }}"
        state: present
      become: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started
      become: yes

    - name: Add target user to docker group
      user:
        name: "{{ target_user }}"
        groups: docker
        append: yes
      become: yes

    # --- Media and browsers ---

    - name: Install media packages
      community.general.pacman:
        name: "{{ media_packages }}"
        state: present
      become: yes

    - name: Install browser packages
      community.general.pacman:
        name: "{{ browser_packages }}"
        state: present
      become: yes

    # --- AUR (VS Code etc) ---

    - name: Check if yay is installed
      command: which yay
      register: yay_check
      changed_when: false
      failed_when: false

    - name: Install yay AUR helper
      when: yay_check.rc != 0
      block:
        - name: Clone yay
          git:
            repo: https://aur.archlinux.org/yay.git
            dest: /tmp/yay
          become_user: "{{ target_user }}"

        - name: Build and install yay
          command: makepkg -si --noconfirm
          args:
            chdir: /tmp/yay
          become_user: "{{ target_user }}"

    - name: Install AUR packages via yay
      command: "yay -S --noconfirm --needed {{ item }}"
      loop: "{{ aur_packages }}"
      become_user: "{{ target_user }}"
      changed_when: false

    # --- Display manager ---

    - name: Install display manager packages
      community.general.pacman:
        name: "{{ display_manager_packages }}"
        state: present
      when: display_manager_packages | length > 0
      become: yes

    - name: Ensure SDDM is enabled and running
      systemd:
        name: sddm
        enabled: yes
        state: started
      when: enable_sddm | bool
      become: yes

    # --- Laptop power management ---

    - name: Install laptop power management packages
      community.general.pacman:
        name: "{{ laptop_power_packages }}"
        state: present
      when: laptop_power_packages | length > 0
      become: yes

    - name: Ensure TLP is enabled and running
      systemd:
        name: tlp
        enabled: yes
        state: started
      when: enable_tlp | bool
      become: yes

    # --- Networking ---

    - name: Ensure NetworkManager is enabled and running
      systemd:
        name: NetworkManager
        enabled: yes
        state: started
      become: yes

    # --- Flatpak ---

    - name: Ensure Flathub remote is configured
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
        method: system
      become: yes

    - name: Install communication Flatpaks
      community.general.flatpak:
        name: "{{ flatpak_comm_apps }}"
        remote: flathub
        state: present
        method: system
      become: yes

    # --- NVM + Node.js ---

    - name: Install NVM for target user
      become_user: "{{ target_user }}"
      shell: |
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
      args:
        creates: "{{ user_home }}/.nvm/nvm.sh"

    - name: Install Node.js versions via NVM
      become_user: "{{ target_user }}"
      shell: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm install {{ item }}
      loop: "{{ nvm_node_versions }}"

    - name: Set default Node.js version
      become_user: "{{ target_user }}"
      shell: |
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm alias default {{ nvm_default }}

    # --- Config files ---

    - name: Create config directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
      loop:
        - "{{ hyprland_dir }}"
        - "{{ waybar_dir }}"
        - "{{ mako_dir }}"

    - name: Deploy Hyprland configuration
      copy:
        src: "files/hypr/hyprland.conf"
        dest: "{{ hyprland_dir }}/hyprland.conf"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy Hyprland workspaces config
      copy:
        src: "files/hypr/workspaces.conf"
        dest: "{{ hyprland_dir }}/workspaces.conf"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy Hyprland hotkeys documentation
      copy:
        src: "files/hypr/HOTKEYS.md"
        dest: "{{ hyprland_dir }}/HOTKEYS.md"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy Waybar config
      copy:
        src: "files/waybar/config.jsonc"
        dest: "{{ waybar_dir }}/config.jsonc"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy Waybar style
      copy:
        src: "files/waybar/style.css"
        dest: "{{ waybar_dir }}/style.css"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy Mako config
      copy:
        src: "files/mako/config"
        dest: "{{ mako_dir }}/config"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Deploy bash aliases
      copy:
        src: "files/bash_aliases"
        dest: "{{ user_home }}/.bash_aliases"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Source bash aliases in bashrc
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: "[ -f ~/.bash_aliases ] && . ~/.bash_aliases"
        state: present
        create: yes

    - name: Display setup completion message
      debug:
        msg: |
          Lean Arch + Hyprland setup complete!

          Profile: {{ arch_profile }}
          Additional user: {{ additional_user }}

          Config files deployed:
            - ~/.config/hypr/hyprland.conf
            - ~/.config/hypr/workspaces.conf
            - ~/.config/hypr/HOTKEYS.md
            - ~/.config/waybar/config.jsonc
            - ~/.config/waybar/style.css
            - ~/.config/mako/config
            - ~/.bash_aliases

          Keybindings (same as before):
            - SUPER+i/j/k/l   = focus up/left/down/right
            - SUPER+SHIFT+ijkl = move window
            - SUPER+Return     = alacritty
            - SUPER+R          = wofi launcher
            - SUPER+X          = clipboard history (cliphist + rofi)
            - SUPER+O          = move window to next monitor

          Dev tools:
            - Docker (enabled, user in docker group)
            - NVM with Node {{ nvm_node_versions | join(', ') }} (default {{ nvm_default }})
            - Python + virtualenv
            - Go, GCC, Clang, CMake

          GPU: AMD (mesa + vulkan-radeon + VAAPI)
          Comm: Slack + Teams via Flatpak

          IMPORTANT: Configure monitors manually:
            hyprctl monitors
            Then create ~/.config/hypr/monitors.conf
