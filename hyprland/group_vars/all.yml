---
# Lean Arch Linux + Hyprland configuration
# Target: Clean desktop build, no bloat

# User configuration
target_user: "{{ ansible_user }}"
user_home: "/home/{{ target_user }}"
additional_user: r4wm

# Config directories
config_base: "{{ user_home }}/.config"
hyprland_dir: "{{ config_base }}/hypr"
waybar_dir: "{{ config_base }}/waybar"
mako_dir: "{{ config_base }}/mako"

# Profile metadata
arch_profile: common

# Core Hyprland + Wayland packages
hyprland_packages_common:
  # Wayland/runtime
  - xorg-xwayland
  - qt5-wayland
  - qt6-wayland
  - polkit-kde-agent
  - seatd

  # Core Hyprland
  - hyprland
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk

  # UI components
  - waybar
  - mako
  - wofi
  - rofi

  # Terminal
  - alacritty

  # File manager
  - dolphin

  # Clipboard (Wayland native)
  - cliphist
  - wl-clipboard

  # System utilities
  - brightnessctl
  - playerctl
  - networkmanager
  - network-manager-applet
  - flatpak
  - htop
  - bat
  - jq
  - curl
  - wget
  - openssh
  - autossh

  # Audio (PipeWire stack)
  - pipewire
  - wireplumber
  - pavucontrol

  # Fonts
  - otf-font-awesome
  - ttf-fira-code
  - ttf-nerd-fonts-symbols-mono
  - noto-fonts-emoji

# Profile overlays
hyprland_packages_extra: []
display_manager_packages: []
laptop_power_packages: []

# AMD GPU packages (RX 7900 XT + Raphael iGPU)
gpu_packages:
  - mesa
  - lib32-mesa
  - vulkan-radeon
  - lib32-vulkan-radeon
  - libva-mesa-driver
  - lib32-libva-mesa-driver
  - mesa-vdpau
  - lib32-mesa-vdpau
  - libva-utils

# Development tools
dev_packages:
  - git
  - github-cli
  - base-devel
  - gcc
  - make
  - cmake
  - clang
  - go
  - python
  - python-pip
  - python-virtualenv
  - ansible
  - gdb
  - emacs-noks

# Container tools
container_packages:
  - docker
  - docker-compose
  - docker-buildx

# Editors (VS Code from AUR, handled separately)
aur_packages:
  - visual-studio-code-bin

# Media tools
media_packages:
  - ffmpeg
  - vlc
  - audacity
  - handbrake

# Browsers
browser_packages:
  - firefox
  - chromium

# Communication (Flatpak)
flatpak_comm_apps:
  - com.slack.Slack
  - com.github.niclasmilholt.teams-for-linux

# NVM node versions
nvm_node_versions:
  - "18"
  - "20"
  - "22"
nvm_default: "22"

# Service toggles
enable_sddm: false
enable_tlp: false

# Feature toggles
install_gaming: false
install_emulator_stack: false
install_flatpak_emulators: false
